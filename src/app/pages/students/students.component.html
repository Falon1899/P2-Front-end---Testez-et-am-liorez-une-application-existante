
<h1>Liste des étudiants</h1>

<!-- Permet d'ajouter un étudiant en réutilisant le formulaire d'inscription -->
<button routerLink="/register" [queryParams]="{ from: 'students' }">
  Ajouter un étudiant
</button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Prénom</th>
      <th>Nom</th>
      <th>Identifiant</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for (student of students; track student.id) {
      <tr>
        <td>{{ student.id }}</td>
        <td>{{ student.firstName }}</td>
        <td>{{ student.lastName }}</td>
        <td>{{ student.login }}</td>
        <td>
          <button [routerLink]="['/students', student.id]">
            Voir
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Aucun étudiant à afficher.</td>
      </tr>
    }
  </tbody>
</table>
